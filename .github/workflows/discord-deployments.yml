name: Discord deployment notifications

on:
  deployment_status:

permissions: {}

jobs:
  notify:
    if: >-
      github.event.deployment.creator.login == 'vercel[bot]' &&
      github.event.deployment.environment == 'Production' &&
      (github.event.deployment_status.state == 'success' ||
       github.event.deployment_status.state == 'failure' ||
       github.event.deployment_status.state == 'error')
    runs-on: ubuntu-latest

    steps:
      - name: Post deployment result to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOYMENT_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)

          status = event["deployment_status"]
          deployment = event["deployment"]
          state = status["state"]
          result = "✅ Succeeded" if state == "success" else "❌ Failed"

          message = (
              f"**WhichBin Orlando production deployment {result}**\n"
              f"Commit: `{deployment['sha'][:7]}`"
          )

          url = status.get("environment_url") or status.get("target_url")
          if url:
              message += f"\nDeployment: {url}"

          payload = json.dumps({
              "content": message,
              "allowed_mentions": {"parse": []},
          }).encode("utf-8")

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "WhichBin-Deployment-Notifier/1.0",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(f"Discord response: {response.status}")
          except urllib.error.HTTPError as error:
              # Do not print the request URL because it contains the webhook token.
              print(f"Discord returned HTTP {error.code}")
              print(error.read().decode("utf-8", errors="replace")[:500])
              raise SystemExit(1)
          PY