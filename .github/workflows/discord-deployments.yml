name: Discord deployment notifications

on:
  deployment_status:

permissions: {}

jobs:
  notify:
    if: >-
      (
        (github.event.deployment.creator.login == 'vercel[bot]' &&
         github.event.deployment.environment == 'Production') ||
        (github.event.deployment.creator.login == 'railway-app[bot]' &&
         github.event.deployment.environment == 'WhichBin-API / production')
      ) &&
      (
        github.event.deployment_status.state == 'success' ||
        github.event.deployment_status.state == 'failure' ||
        github.event.deployment_status.state == 'error'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Post deployment result to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOYMENT_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)

          deployment = event["deployment"]
          status = event["deployment_status"]
          repository = event["repository"]

          service = (
              "Vercel"
              if deployment["creator"]["login"] == "vercel[bot]"
              else "Railway"
          )

          succeeded = status["state"] == "success"
          result = "Deployed successfully" if succeeded else "Deployment failed"
          color = 0x2ECC71 if succeeded else 0xE74C3C
          icon = "✅" if succeeded else "❌"

          sha = deployment["sha"]
          commit_url = f"{repository['html_url']}/commit/{sha}"

          embed = {
              "title": f"{icon} {service} · {result}",
              "description": f"**WhichBin Orlando** · Production",
              "color": color,
              "fields": [
                  {
                      "name": "Commit",
                      "value": f"[`{sha[:7]}`]({commit_url})",
                      "inline": True,
                  },
                  {
                      "name": "Service",
                      "value": service,
                      "inline": True,
                  },
              ],
              "footer": {"text": "WhichBin Orlando deployments"},
          }

          homepage = repository.get("homepage")
          if homepage:
              embed["url"] = homepage
              embed["fields"].append({
                  "name": "Website",
                  "value": f"[Open WhichBin Orlando]({homepage})",
                  "inline": False,
              })

          payload = json.dumps({
              "username": "WhichBin Deployments",
              "embeds": [embed],
              "allowed_mentions": {"parse": []},
          }).encode("utf-8")

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "WhichBin-Deployment-Notifier/1.0",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(f"Discord response: {response.status}")
          except urllib.error.HTTPError as error:
              print(f"Discord returned HTTP {error.code}")
              print(error.read().decode("utf-8", errors="replace")[:500])
              raise SystemExit(1)
          PY