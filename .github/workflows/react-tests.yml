name: React tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: whichbin-client/package-lock.json

      - name: Install dependencies
        working-directory: whichbin-client
        run: npm ci

      - name: Run frontend tests
        working-directory: whichbin-client
        run: npm test
