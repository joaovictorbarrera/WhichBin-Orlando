worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $ssl_server_name $api_upstream {
        default "";
        api.whichbin-orlando.org whichbin-production-api;
        betaapi.whichbin-orlando.org whichbin-staging-api;
    }

    server {
        listen 80 default_server;
        server_name api.whichbin-orlando.org betaapi.whichbin-orlando.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name api.whichbin-orlando.org betaapi.whichbin-orlando.org;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        resolver 127.0.0.11 valid=10s ipv6=off;

        if ($api_upstream = "") {
            return 421;
        }

        location / {
            proxy_pass http://$api_upstream:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
