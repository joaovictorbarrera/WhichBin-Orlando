# Application
spring.application.name=whichbin-api

# Server
server.address=0.0.0.0
server.port=${PORT:443}
server.ssl.enabled=true
server.ssl.key-store=${TLS_KEYSTORE:file:/run/secrets/whichbin-orlando.org-fullchain.pfx}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.servlet.context-path=/api

# Client
app.client-url=${CLIENT_URL:http://localhost:7000}

# Database
# Added "allowPublicKeyRetrieval=true" to allow MySQL driver to access DB for tests
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/whichbin_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Limit request concurrency and the number of open client connections.
server.tomcat.threads.max=${HTTP_MAX_THREADS:50}
server.tomcat.threads.min-spare=${HTTP_MIN_SPARE_THREADS:5}
server.tomcat.max-connections=${HTTP_MAX_CONNECTIONS:200}

# Web API
spring.web.error.include-stacktrace=never

# Auth
app.auth.token-ttl=${AUTH_TOKEN_TTL:PT24H}
# Cleans up expired tokens every day at 3am local server time
app.auth.token-cleanup-cron=${AUTH_TOKEN_CLEANUP_CRON:0 0 3 * * *}