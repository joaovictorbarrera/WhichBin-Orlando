spring.config.import=optional:classpath:application-test-local.properties

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/whichbin_test}

spring.jpa.hibernate.ddl-auto=create-drop

# Hibernate may warn when create-drop tries to remove foreign keys from a
# fresh test database; keep actual schema-generation errors visible.
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR
