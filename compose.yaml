services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: whichbin_db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  whichbin-api:
    image: whichbin-api:${APP_VERSION:-0.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "443:443"
    cap_add:
      - NET_BIND_SERVICE
    environment:
      PORT: "443"
      DB_URL: jdbc:mysql://mysql:3306/whichbin_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD}
      CLIENT_URL: ${CLIENT_URL}
    volumes:
      - type: bind
        source: ${TLS_CERT_FILE:-./secrets/whichbin-orlando.org-fullchain.pfx}
        target: /run/secrets/whichbin-orlando.org-fullchain.pfx
        read_only: true

volumes:
  mysql_data:
